<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawFitness Login Page</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login-page">
        <header class="header">
            <img src="photos/rawFitness.png" alt="logo" width="500">
            <p style="margin-top: -45px;">DISCIPLINE LIVES HERE</p>
        </header>
        <main class="main">
            <div class="content">
                <h1 class="title">STRONGER <br>EVERYDAY</h1>
                <div class="underline"></div>
                <p class="subtitle">SIGN IN TO CONTINUE</p>
            </div>
            <form action="" class="form">
                <div class="input-group">
                    <span class="icon icon-envelop">
                        <svg xmlns="http://www.w3.org/2000/svg" id="Outline" viewBox="0 0 24 24" width="20" height="20">
                            <path
                                d="M19,1H5A5.006,5.006,0,0,0,0,6V18a5.006,5.006,0,0,0,5,5H19a5.006,5.006,0,0,0,5-5V6A5.006,5.006,0,0,0,19,1ZM5,3H19a3,3,0,0,1,2.78,1.887l-7.658,7.659a3.007,3.007,0,0,1-4.244,0L2.22,4.887A3,3,0,0,1,5,3ZM19,21H5a3,3,0,0,1-3-3V7.5L8.464,13.96a5.007,5.007,0,0,0,7.072,0L22,7.5V18A3,3,0,0,1,19,21Z" />
                        </svg>
                    </span>
                    <input type="text" placeholder="Email or Mobile Number">
                </div>
                <div class="input-group">
                    <span class="icon icon-password">
                        <svg xmlns="http://www.w3.org/2000/svg" id="Outline" viewBox="0 0 24 24" width="512"
                            height="512">
                            <path
                                d="M19,8.424V7A7,7,0,0,0,5,7V8.424A5,5,0,0,0,2,13v6a5.006,5.006,0,0,0,5,5H17a5.006,5.006,0,0,0,5-5V13A5,5,0,0,0,19,8.424ZM7,7A5,5,0,0,1,17,7V8H7ZM20,19a3,3,0,0,1-3,3H7a3,3,0,0,1-3-3V13a3,3,0,0,1,3-3H17a3,3,0,0,1,3,3Z" />
                            <path d="M12,14a1,1,0,0,0-1,1v2a1,1,0,0,0,2,0V15A1,1,0,0,0,12,14Z" />
                        </svg>

                    </span>
                    <input type="password" placeholder="Password">
                </div>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>
                <button type="submit" class="btn btn-primary">
                    SIGN IN
                </button>
                <div class="divider">
                    <span class="divider-stroke"></span>
                    <span class="divider-text">OR</span>
                    <span class="divider-stroke"></span>
                </div>
                <button type="button" class="btn btn-google">
                    Continue with Google
                </button>
                <p class="signup-text">
                    Don't have an account?
                    <a href="#" class="signup">Sign Up</a>
                </p>
            </form>
        </main>
        <footer class="footer">
            <p>DISCIPLINE BUILDS FREEDOM</p>
        </footer>
    </div>
</body>

</html>
